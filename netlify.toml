# Netlify deployment configuration
# Monorepo — Astro app is in apps/web/

[build]
  command = "pnpm run build:vps"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "22"
  NODE_OPTIONS = "--experimental-sqlite"

# The @astrojs/node adapter outputs a standalone server
# Netlify runs it via the entry point
[functions]
  node_bundler = "esbuild"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Redirects (keep in sync with astro.config.mjs)
[[redirects]]
  from = "/resources"
  to = "/blog"
  status = 301

[[redirects]]
  from = "/work/*"
  to = "/our-work/:splat"
  status = 301

[[redirects]]
  from = "/capabilities/brand-communications"
  to = "/capabilities/brand-communication"
  status = 301

[[redirects]]
  from = "/gro/courses/artificial-intelligence-in-digital-marketing/"
  to = "/our-work/"
  status = 301

[[redirects]]
  from = "/turn-your-business-to-an-authentic-brand-in-kenya/"
  to = "/blog"
  status = 301

[[redirects]]
  from = "/ai-studio/agents-development/kuzafy/"
  to = "/solutions/kuzafy/"
  status = 301

# SPA-style fallback — all unmatched routes go to the SSR handler
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/entry"
  status = 200
