# Wrangler configuration for Cloudflare Pages
# Monorepo — Astro app is in apps/web/
# Docs: https://developers.cloudflare.com/pages/functions/wrangler-configuration/
name = "madavi"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# ─── Build ────────────────────────────────────────────────────────────────
[build]
command = "pnpm run build:cf"
directory = "apps/web/dist"

# ─── Environment ───────────────────────────────────────────────────────────
[env.production]
vars = { DEPLOY_TARGET = "cloudflare" }

# ─── Public environment variables ──────────────────────────────────────────
# These are safe to include in the config — they're exposed to the browser.
# Secret keys (API tokens, passwords) must be set via:
#   pnpm wrangler pages secret put <KEY>
# or the Cloudflare Dashboard → Workers & Pages → madavi → Settings → Environment variables.
[vars]
PUBLIC_SANITY_PROJECT_ID = "6u680gce"
PUBLIC_SANITY_DATASET = "production"
PUBLIC_TURNSTILE_SITE_KEY = "0x4AAAAAAAaCsNSU6kPatEyp"
PUBLIC_GA4_ID = "G-MWD6444FBQ"
META_PIXEL_ID = "288245505871398"
PUBLIC_R2_CDN_URL = "https://images.madavi.co"

# ─── Secrets (set via Cloudflare Dashboard or `wrangler secret put`) ───────
#
# Required for production:
#   SANITY_PROJECT_ID           — Sanity CMS project ID
#   SANITY_DATASET              — Sanity dataset (usually "production")
#   SANITY_API_VERSION          — Sanity API version date (e.g. "2024-01-01")
#   SANITY_READ_TOKEN           — Sanity read token
#
#   TURNSTILE_SECRET_KEY        — Cloudflare Turnstile secret key
#
#   ZEPTOMAIL_API_KEY           — Zoho ZeptoMail API key
#   ZEPTOMAIL_FROM_ADDRESS      — Sender email (e.g. "agency@madavi.co")
#   ZEPTOMAIL_FROM_NAME         — Sender name (e.g. "Madavi Inc.")
#
#   ZOHO_DATACENTER             — Zoho account datacenter (e.g. "com")
#   ZOHO_REFRESH_TOKEN          — Zoho OAuth refresh token
#   ZOHO_CLIENT_ID              — Zoho OAuth client ID
#   ZOHO_CLIENT_SECRET          — Zoho OAuth client secret
#
#   WEBHOOK_SECRET              — Webhook secret for cache revalidation
